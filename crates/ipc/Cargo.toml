[package]
name    = "mizu-ipc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mizu-core  = { path = "../core" }
# rkyv 0.8 with bytecheck (for safe archive validation before any access).
rkyv       = { version = "0.8", features = ["bytecheck"] }
bytecheck  = "0.7"
thiserror  = "2"
tracing    = "0.1"
# Must match mizu-core's version: `UrlRegistry`/`logic_fns` are `FxHashMap`s
# in core's public API, so the two crates have to agree on the hasher type.
rustc-hash = "2"

# Unix shared-memory + socket ancillary-data support (memfd_create, mmap).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["mman", "fs", "net"] }

# Windows named pipes + CreateFileMapping / MapViewOfFile.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_Security_Cryptography",
] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5.0"
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
