[package]
name = "mizu-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
thiserror = "2"
nom = "7.1.3"
tracing = "0.1.44"
taffy = "0.5"
ego-tree = "0.10"
rustc-hash = "2"
serde = { version = "1.0.228", features = ["derive"] }
# `arbitrary_precision`: numbers arrive as their original token text, which is
# what lets `Value` keep the integer/decimal distinction and parse each side
# exactly instead of rounding everything through `f64`.
# `unbounded_depth`: lets `from_json_*` turn off serde_json's own 128-level
# recursion cap so `MAX_JSON_DEPTH` is the single depth authority — see the
# `disable_recursion_limit` call site for why two competing limits was a bug.
serde_json = { version = "1.0.150", features = [
    "arbitrary_precision",
    "unbounded_depth",
] }
toml = { version = "0.8", features = ["parse"] }
aes-gcm = "0.10"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
url = "2"
keyring = "3.6.2"
redb = "2.1"
hkdf = "0.12"
zeroize = "1"
rand_core = "0.6"
rand_chacha = "0.3"
http = "1"

[target.'cfg(not(kani))'.dependencies]
hickory-resolver = { version = "0.24", default-features = false }

[dev-dependencies]
criterion = "0.5"
# Property testing for the surfaces Kani cannot reach. The security harnesses
# must keep `url`/`idna` out of their reachability graph (it ICEs Kani's
# codegen — see the note at the end of `core::uri`), and CBMC does not scale to
# the self-referential `Value`/`ValueType`/`Expr` types. Both run fine natively,
# so the parsers and the URI policy are covered here instead.
proptest = "1"

[[bench]]
name = "parse_and_eval"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
