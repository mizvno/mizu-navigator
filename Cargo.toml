[workspace]
members = ["crates/core"]

[package]
name = "mizu-navigator"
version = "0.1.0"
edition = "2024"
description = "Mizu Navigator"
license = "GPL-3.0-only"
repository = ""
default-run = "mizu-navigator"

[lib]
name = "mizu"
path = "src/lib.rs"

[dependencies]
mizu-core = { path = "crates/core" }
thiserror = "2"
nom = "7.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

taffy = "0.5"

ego-tree = "0.10"
winit = "0.29"
# Pinned to the last accesskit_winit line compatible with winit 0.29
# (0.20+ requires winit 0.30's ActiveEventLoop API). Do not bump without
# also bumping winit — see UX-REMEDIATION-ROADMAP.md ux-2.
accesskit = "0.13"
accesskit_winit = "0.19"
vello = "0.1.0"
parley = { version = "0.10.0", features = ["complex-scripts"] }
pollster = "0.3"
wgpu = "0.19"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "time", "net", "macros", "fs"] }
quinn = "0.11.9"
rustls = "0.23.40"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = { version = "0.8", features = ["parse"] }
aes-gcm = "0.10"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
keyring = "3.6.2"
arboard = "3.6.1"
webpki-roots = "1.0.7"
image = { version = "0.25", default-features = false, features = ["gif", "webp"] }
icu_segmenter = { version = "2", features = ["auto"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime", "dns-over-rustls", "webpki-roots"] }
rustc-hash = "2"
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
url = "2"
redb = "2.1"
lru = "0.12"

hkdf = "0.12"
zeroize = "1"
serde_yaml_bw = "2.5.6"
rfd = "0.17.2"
rand_core = "0.6"
rand_chacha = "0.3"
miniz_oxide = "0.8"

[target.'cfg(windows)'.dependencies]
windows-dpapi = "0.2.0"


[features]
default = []
insecure-dev = []

[lints.rust]
# `kani` is set by the Kani model checker when it runs proofs; rustc doesn't
# know about it during normal builds, so we declare it as an expected cfg to
# suppress unexpected_cfgs warnings on #[cfg(kani)] / #[cfg(not(kani))] guards.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.dev]
debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = true
strip = "symbols"

[dev-dependencies]
# The tree consumer that `accesskit_winit` drives on the platform side. Pulled
# in for tests only, so the accessibility updates we emit can be fed to the
# real consumer instead of to an assumption about how it reacts — it panics on
# input shapes `accesskit`'s own types happily represent.
accesskit_consumer = "0.18"
futures-util = "0.3.33"
multer = "3.1.0"
tempfile = "3"

# A harness with no `#[kani::unwind]` would otherwise run with no bound at all,
# and `MizuError::MultipleErrors(Vec<MizuError>)` makes `drop_in_place` on it
# recursive — CBMC unwinds that recursion forever rather than failing, which is
# how the security harnesses came to appear hung. Any harness that can
# construct a `MizuError` needs a bound; this makes forgetting one produce a
# slow proof or an unwinding-assertion failure instead of a run that never ends.
#
# Harnesses that need a different bound still set `#[kani::unwind]` themselves,
# and that attribute wins over this default — the quota proofs deliberately use
# 2, which is enough for their (leaf-variant only) errors and ~16x faster than 3.
#
# This has to live in the workspace root: Kani reads `[workspace.metadata.kani]`
# and silently ignores the same table under `[package.metadata.kani]` in
# `crates/core/Cargo.toml`, with no warning that the setting did nothing.
# Confirm it is live with `cargo kani --verbose` and look for `--unwind` in the
# `cbmc` command line.
[workspace.metadata.kani]
flags = { default-unwind = "12" }
